<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GetRoom - Find Student Rooms</title>
    <link rel="stylesheet" href="rooms.css" />
    <link rel="stylesheet" href="auth.css" />
    <script src="auth.js"></script>
    <script>
      // Rooms are only visible to logged-in users. Delete this line to make rooms public.
      GetRoomAuth.requireLogin();
    </script>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <div class="logo-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1a5cff"
            stroke-width="2"
          >
            <path
              d="M2 4v16M2 8h12a4 4 0 0 1 4 4v8M2 12h16M2 16h20M6 8a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2H6V8z"
            />
          </svg>
        </div>
        <span>GetRoom</span>
      </div>
      <div class="nav-links" id="navLinks">
        <a href="#" class="nav-link active">Search</a>
        <a href="#" class="nav-link">Favourites</a>
        <a href="#" class="nav-link">Messages</a>
        <a href="#" class="nav-link">Help</a>
        <div class="nav-actions">
          <span class="auth-area" data-auth-area>
            <a href="login.html" class="btn-login">Login</a>
            <a href="signup.html" class="btn-signup">Sign Up</a>
          </span>
          <button class="bell-btn" id="bellBtn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-6 9-6 9h18s-6-2-6-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg
            ><span class="notif-dot"></span>
          </button>
          <img
            src="imgs/default-avatar.jpg"
            alt="Profile"
            class="profile-pic"
            id="profilePic"
            title="Click to change profile picture"
          />
          <input type="file" id="profileInput" accept="image/*" hidden />
        </div>
      </div>
      <button class="hamburger" id="hamburger">☰</button>
    </nav>

    <div class="results-bar">
      <div class="results-left">
        <h2 id="resultsTitle">70 rooms near NWU Rustenburg Campus</h2>
        <p id="resultsInfo">Showing 0 of 0 results</p>
      </div>
      <div class="results-right">
        <span style="font-size: 13px">Sort by:</span
        ><select id="sortSelect">
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="distance">Distance Closest First</option></select
        ><button class="active">Grid</button>
      </div>
    </div>

    <div class="main-layout">
      <div class="filters">
        <div class="filters-header">
          <p><b>Filters</b></p>
          <a class="clearall" href="#" id="clearAll">Clear all</a>
        </div>
        <div class="filter-group">
          <h4>Price range (ZAR) - Max</h4>
          <input
            type="range"
            min="1500"
            max="6000"
            value="6000"
            id="priceRange"
            style="width: 100%"
          />
          <div class="price-labels">
            <span>R1,500</span><span id="priceValue">R6,000</span>
          </div>
        </div>
        <div class="filter-group">
          <h4>Distance to Campus</h4>
          <label
            ><input type="radio" name="dist" value="1" /> Within 1
            km</label
          ><label
            ><input type="radio" name="dist" value="2" /> Within 2 km</label
          ><label
            ><input type="radio" name="dist" value="5" /> Within 5 km</label
          ><label
            ><input type="radio" name="dist" value="10" /> Within 10 km</label
          ><label
            ><input type="radio" name="dist" value="100" checked /> Any distance</label
          >
        </div>
        <div class="filter-group">
          <h4>Room Type</h4>
          <label
            ><input type="checkbox" class="roomType" value="Single Room" />
            Single Room</label
          ><label
            ><input type="checkbox" class="roomType" value="Shared Room" />
            Shared Room</label
          ><label
            ><input type="checkbox" class="roomType" value="Studio Apartment" />
            Studio Apartment</label
          ><label
            ><input type="checkbox" class="roomType" value="Shared Apartment" />
            Shared Apartment</label
          ><label
            ><input type="checkbox" class="roomType" value="Residence Hall" />
            Residence Hall</label
          >
        </div>
        <div class="filter-group">
          <h4>Amenities</h4>
          <label
            ><input type="checkbox" class="amenity" value="wifi" /> Wi-Fi</label
          ><label
            ><input type="checkbox" class="amenity" value="study" /> Study Room
            / Desk</label
          ><label
            ><input type="checkbox" class="amenity" value="laundry" />
            Laundry</label
          ><label
            ><input type="checkbox" class="amenity" value="parking" />
            Parking</label
          ><label
            ><input type="checkbox" class="amenity" value="gym" /> Gym</label
          ><label
            ><input type="checkbox" class="amenity" value="security" /> Security
            24/7</label
          >
        </div>
        <button class="apply-btn" id="applyBtn">Apply Filters (70)</button
        ><button class="reset-btn" id="resetBtn">Reset Filters</button>
      </div>
      <div class="rooms-container" id="roomsContainer"></div>
    </div>

    <div class="modal" id="roomModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-box">
        <button class="modal-close" id="closeModal" aria-label="Close">&times;</button>
        <img id="modalImg" class="modal-img" src="" alt="" />
        <div class="modal-content">
          <div class="modal-head">
            <h2 id="modalTitle"></h2>
            <span class="modal-price" id="modalPrice"></span>
          </div>
          <p id="modalAbout" class="modal-about"></p>
          <div class="modal-details" id="modalDetails"></div>
          <h4>Amenities</h4>
          <ul class="modal-amenities" id="modalAmenities"></ul>
          <p class="booked-msg" id="bookedMsg"></p>
          <button class="book-btn" id="bookBtn">Book this room</button>
          <form id="bookingForm" class="booking-form" novalidate>
            <h4>Booking details</h4>
            <input type="text" id="fullName" placeholder="Full name (first name and surname)" autocomplete="name" />
            <input type="tel" id="bookPhone" placeholder="Phone number (e.g. 082 123 4567)" autocomplete="tel" />
            <input type="email" id="bookEmail" placeholder="Email address" autocomplete="email" />
            <label>Move-in date <input type="date" id="moveIn" /></label>
            <p class="form-error" id="formError"></p>
            <button type="submit" class="book-btn">Confirm booking</button>
          </form>
        </div>
      </div>
    </div>

    <script src="room-images.js"></script>
    <script src="rooms.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - GetRoom</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏠%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-page">
    <a href="home.html" class="auth-brand">GetRoom</a>
    <main class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to view available student rooms.</p>
      <p class="auth-notice" id="authNotice" hidden>🔒 Please log in to view available rooms.</p>
      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com" />
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Your password" />
        <p class="form-error" id="formError" role="alert"></p>
        <button type="submit" class="submit" id="submitBtn">Log in</button>
      </form>
      <p class="auth-switch">New to GetRoom? <a href="signup.html" id="toSignup">Create an account</a></p>
    </main>
    <script src="auth.js"></script>
    <script src="login.js"></script>
  </body>
</html>

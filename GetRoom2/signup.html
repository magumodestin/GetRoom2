<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up - GetRoom</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏠%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-page">
    <a href="home.html" class="auth-brand">GetRoom</a>
    <main class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Sign up to browse and book student rooms.</p>
      <p class="auth-notice" id="authNotice" hidden>🔒 Create a free account to view available rooms.</p>
      <form id="signupForm" novalidate>
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" autocomplete="name" placeholder="First name and surname" />
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com" />
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" autocomplete="tel" placeholder="082 123 4567" />
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" />
        <p class="hint">Use letters and at least one number.</p>
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" placeholder="Repeat password" />
        <p class="form-error" id="formError" role="alert"></p>
        <button type="submit" class="submit" id="submitBtn">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html" id="toLogin">Log in</a></p>
    </main>
    <script src="auth.js"></script>
    <script src="signup.js"></script>
  </body>
</html>
